<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#152b42"><title>測量PDF 現場メモ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#16283b}*{box-sizing:border-box}body{margin:0;background:#edf2f7}header{background:#152b42;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}header strong{font-size:17px}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}.btn{background:white;border:1px solid #bbc7d3;border-radius:9px;padding:10px 12px;min-height:42px;color:#20374e}.primary{background:#176bb2;color:white;border-color:#176bb2}.toolbar{display:flex;gap:7px;overflow-x:auto;padding:9px;background:#fff;border-bottom:1px solid #d3dbe5}.tool{flex:0 0 auto;min-width:63px}.tool.active{background:#176bb2;color:white;border-color:#176bb2}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:9px;background:#f8fafc;border-bottom:1px solid #d3dbe5;font-size:14px}.controls label{display:flex;align-items:center;gap:5px}.controls input[type=number]{width:65px}.controls input[type=color]{width:40px;height:36px;border:0;background:none}.controls input[type=text]{min-width:130px;max-width:210px;width:40vw;padding:9px;border:1px solid #b9c7d5;border-radius:7px;font-size:16px}.controls select{padding:8px;border:1px solid #b9c7d5;border-radius:7px}.workarea{height:calc(100dvh - 260px);min-height:230px;overflow:auto;background:#cbd5e1;touch-action:pan-x pan-y;overscroll-behavior:contain}.page{position:relative;margin:16px auto;background:white;box-shadow:0 2px 14px #0002;transform-origin:top left}.page canvas{position:absolute;left:0;top:0;width:100%;height:100%}#overlay{touch-action:none}.hint{font-size:12px;color:#526579;padding:8px 12px;background:#f5f8fb;min-height:35px}.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;background:white;border-top:1px solid #d3dbe5}.pager span{min-width:95px;text-align:center}.empty{margin:30px auto;padding:28px 16px;text-align:center;max-width:430px;background:#fff;border-radius:12px;color:#4b6073}.empty h2{color:#16283b}.status{font-size:12px;max-width:45vw;text-align:right}#file{display:none}#editor{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:center;justify-content:center;padding:16px}#editor .box{background:white;border-radius:14px;padding:20px;width:min(100%,430px);display:grid;gap:13px}#editor input{padding:12px;border:1px solid #aab8c6;border-radius:8px;font-size:18px;width:100%}#editor .row{display:flex;gap:10px;justify-content:flex-end}.hide{display:none!important}@media(max-width:480px){header strong{font-size:15px}.workarea{height:calc(100dvh - 330px)}.btn{padding:9px}.controls{gap:6px}}
</style></head><body>
<header><strong>📐 測量PDF 現場メモ <small style="font-weight:normal">Ver.1.1</small></strong><span class="status" id="status">PDFを読み込んでください</span></header>
<div class="toolbar"><button class="btn primary" id="open">📂 PDFを開く</button><input id="file" type="file" accept="application/pdf,.pdf"><button class="btn" id="save" disabled>⬇ PDF出力</button><button class="btn" id="undo" disabled>↶ 戻す</button><button class="btn" id="del" disabled>🗑 選択削除</button></div>
<div class="toolbar" id="tools"><button class="btn tool active" data-tool="move">✋ 移動</button><button class="btn tool" data-tool="text">Ｔ 文字</button><button class="btn tool" data-tool="pen">✏️ ペン</button><button class="btn tool" data-tool="line">／ 直線</button><button class="btn tool" data-tool="circle">◯ 丸</button><button class="btn tool" data-tool="arrow">➜ 矢印</button><button class="btn tool" data-tool="select">☝ 選択</button></div>
<div class="controls"><label>文字方式 <select id="textmode"><option value="tap">タップして入力</option><option value="prepare">先に入力して配置</option></select></label><input id="prepared" type="text" placeholder="配置する文字" class="hide"><label>色 <input id="color" type="color" value="#e11d48"></label><label>太さ <input id="width" type="number" value="2" min="1" max="15" step="1"></label><label>文字 <input id="fontsize" type="number" value="16" min="6" max="90"></label><label>回転 <input id="rotation" type="number" value="0" min="-360" max="360" step="5">°</label><button class="btn" id="fit">全体表示</button><button class="btn" id="zin">＋</button><button class="btn" id="zout">－</button><span id="zoomlabel">100%</span></div>
<div id="area" class="workarea"><div id="empty" class="empty"><h2>PDFに現場メモを書き込む</h2><p>PDFを開き、文字・手書き・線・丸・矢印を記入できます。複数ページに対応します。</p><p style="font-size:13px">PDFの読み込み・出力には初回インターネット接続が必要です。ファイルは外部サーバーへ送信しません。</p></div><div id="page" class="page hide"><canvas id="pdfcanvas"></canvas><canvas id="overlay"></canvas></div></div>
<div class="pager"><button class="btn" id="prev" disabled>◀ 前へ</button><span id="pages">0 / 0</span><button class="btn" id="next" disabled>次へ ▶</button></div>
<div class="hint" id="hint">移動モード：指でスクロール・2本指で拡大縮小できます。書き込みは各モードを選択してください。</div>
<div id="editor"><div class="box"><strong id="editortitle">文字を入力</strong><input id="editinput" placeholder="現地確認内容"><div class="row"><button class="btn" id="cancel">キャンセル</button><button class="btn primary" id="confirm">決定</button></div></div></div>
<script type="module">
const $=id=>document.getElementById(id);const area=$('area'),pageEl=$('page'),base=$('pdfcanvas'),overlay=$('overlay');let pdfjs,pdfLib,pdf=null,bytes=null,items={},pageNo=1,scale=1,tool='move',selected=null,drag=null,history=[],originalName='測量図面',pageSize={w:595,h:842},renderSeq=0,pdfRenderTask=null;let editTarget=null,editPoint=null;
const msg=s=>$('status').textContent=s;const hint=s=>$('hint').textContent=s;const current=()=>items[pageNo]||(items[pageNo]=[]);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
async function loadLibs(){if(pdfjs&&pdfLib)return;msg('PDF機能を読み込み中…');try{const r=await Promise.all([import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs'),import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm')]);pdfjs=r[0];pdfLib=r[1];pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';}catch(e){msg('通信エラー');throw Error('PDFライブラリを読み込めません。インターネット接続を確認してください。')}}
function saveState(){if(!bytes)return;try{localStorage.setItem('survey_pdf_notes',JSON.stringify({name:originalName,items,pageNo}));}catch(e){}}function checkpoint(){history.push(JSON.stringify(items));if(history.length>35)history.shift();$('undo').disabled=false;}
async function openPdf(b,name,restore=false){await loadLibs();const buf=b.slice(0);const doc=await pdfjs.getDocument({data:buf}).promise;pdf=doc;bytes=b;originalName=name.replace(/\.pdf$/i,'');items={};history=[];selected=null;pageNo=1;scale=1;if(restore){try{const saved=JSON.parse(localStorage.getItem('survey_pdf_notes')||'{}');if(saved.name===originalName){items=saved.items||{};pageNo=clamp(saved.pageNo||1,1,pdf.numPages)}}catch(e){}}$('empty').classList.add('hide');pageEl.classList.remove('hide');$('save').disabled=false;$('undo').disabled=true;await fitPage();msg(`${pdf.numPages}ページ 読込完了（全体表示）`);}
async function render(){if(!pdf)return;const id=++renderSeq;const p=await pdf.getPage(pageNo);if(id!==renderSeq)return;const viewport=p.getViewport({scale});pageSize={w:p.view[2]-p.view[0],h:p.view[3]-p.view[1]};const ratio=Math.min(window.devicePixelRatio||1,2);pageEl.style.width=viewport.width+'px';pageEl.style.height=viewport.height+'px';for(const c of [base,overlay]){c.width=Math.round(viewport.width*ratio);c.height=Math.round(viewport.height*ratio);c.style.width=viewport.width+'px';c.style.height=viewport.height+'px'}const ctx=base.getContext('2d');ctx.setTransform(1,0,0,1,0,0);try{if(pdfRenderTask){pdfRenderTask.cancel();try{await pdfRenderTask.promise}catch(e){}}pdfRenderTask=p.render({canvasContext:ctx,viewport,transform:ratio===1?undefined:[ratio,0,0,ratio,0,0]});await pdfRenderTask.promise;}catch(e){if(e.name!=='RenderingCancelledException')msg('表示エラー: '+e.message)}if(id!==renderSeq)return;draw();$('pages').textContent=`${pageNo} / ${pdf.numPages}`;$('prev').disabled=pageNo===1;$('next').disabled=pageNo===pdf.numPages;$('zoomlabel').textContent=Math.round(scale*100)+'%';$('del').disabled=!selected;saveState();}
function draw(){if(!pdf)return;const c=overlay.getContext('2d');const ratio=Math.min(window.devicePixelRatio||1,2);c.setTransform(ratio*scale,0,0,ratio*scale,0,0);c.clearRect(0,0,pageSize.w,pageSize.h);for(const it of current())drawItem(c,it,it===selected);if(drag&&drag.preview)drawItem(c,drag.preview,false);}
function drawItem(c,it,sel=false){c.save();c.strokeStyle=it.color;c.fillStyle=it.color;c.lineWidth=it.width||2;c.lineCap='round';c.lineJoin='round';if(it.type==='text'){c.translate(it.x,it.y);c.rotate((it.rotation||0)*Math.PI/180);c.font=`${it.fontsize||16}px sans-serif`;c.textBaseline='top';c.fillText(it.text,0,0);if(sel){const w=c.measureText(it.text).width;c.strokeStyle='#1683d5';c.setLineDash([4,3]);c.strokeRect(-3,-3,w+6,(it.fontsize||16)+6)}}else if(it.type==='pen'){c.beginPath();it.points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke()}else{c.beginPath();if(it.type==='circle'){c.ellipse((it.x+it.x2)/2,(it.y+it.y2)/2,Math.max(.1,Math.abs(it.x2-it.x)/2),Math.max(.1,Math.abs(it.y2-it.y)/2),0,0,Math.PI*2)}else{c.moveTo(it.x,it.y);c.lineTo(it.x2,it.y2)}c.stroke();if(it.type==='arrow'){const a=Math.atan2(it.y2-it.y,it.x2-it.x),l=12;c.beginPath();c.moveTo(it.x2,it.y2);c.lineTo(it.x2-l*Math.cos(a-.5),it.y2-l*Math.sin(a-.5));c.moveTo(it.x2,it.y2);c.lineTo(it.x2-l*Math.cos(a+.5),it.y2-l*Math.sin(a+.5));c.stroke()}if(sel){c.strokeStyle='#1683d5';c.setLineDash([3,3]);c.strokeRect(Math.min(it.x,it.x2)-5,Math.min(it.y,it.y2)-5,Math.abs(it.x2-it.x)+10,Math.abs(it.y2-it.y)+10)}}c.restore()}
function pt(e){const r=overlay.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/scale,0,pageSize.w),y:clamp((e.clientY-r.top)/scale,0,pageSize.h)}}function settings(){return{color:$('color').value,width:clamp(+$('width').value||2,1,15),fontsize:clamp(+$('fontsize').value||16,6,90),rotation:clamp(+$('rotation').value||0,-360,360)}}function findItem(p){const arr=current();for(let i=arr.length-1;i>=0;i--){const it=arr[i];if(it.type==='text'){const w=(it.text.length||1)*(it.fontsize||16);if(Math.abs(p.x-it.x)<w+8&&Math.abs(p.y-it.y)<(it.fontsize||16)+12)return it}else if(it.type==='pen'){if(it.points.some(q=>Math.hypot(p.x-q.x,p.y-q.y)<12))return it}else if(p.x>=Math.min(it.x,it.x2)-12&&p.x<=Math.max(it.x,it.x2)+12&&p.y>=Math.min(it.y,it.y2)-12&&p.y<=Math.max(it.y,it.y2)+12)return it}return null}
function setTool(t){tool=t;selected=null;drag=null;for(const b of document.querySelectorAll('[data-tool]'))b.classList.toggle('active',b.dataset.tool===t);overlay.style.pointerEvents=t==='move'?'none':'auto';hint(t==='move'?'移動：指でスクロール、2本指でピンチ拡大。＋－でも倍率変更できます。':t==='text'?'文字：図面をタップして入力・配置。入力済み文字は「選択」で編集できます。':t==='select'?'選択：文字や図形をタップして選択。ドラッグで移動。文字はダブルタップで修正。':'指で図面上に描画。誤操作は「戻す」で取り消せます。');$('del').disabled=true;draw()}
function openEditor(p,it=null){editPoint=p;editTarget=it;$('editortitle').textContent=it?'文字を修正':'文字を入力';$('editinput').value=it?it.text:'';$('editor').style.display='flex';setTimeout(()=>$('editinput').focus(),80)}function closeEditor(){$('editor').style.display='none';editTarget=null;editPoint=null}
$('confirm').onclick=()=>{const t=$('editinput').value.trim();if(t){checkpoint();if(editTarget){editTarget.text=t}else{current().push({type:'text',text:t,x:editPoint.x,y:editPoint.y,...settings()})}draw();saveState()}closeEditor()};$('cancel').onclick=closeEditor;$('editinput').addEventListener('keydown',e=>{if(e.key==='Enter')$('confirm').click()});
overlay.addEventListener('pointerdown',e=>{if(!pdf||tool==='move')return;e.preventDefault();overlay.setPointerCapture(e.pointerId);const p=pt(e);if(tool==='text'){if($('textmode').value==='prepare'){const t=$('prepared').value.trim();if(!t){hint('先に入力欄に文字を入れてください');return}checkpoint();current().push({type:'text',text:t,...p,...settings()});draw();saveState()}else openEditor(p);return}if(tool==='select'){selected=findItem(p);$('del').disabled=!selected;if(selected)drag={start:p,orig:JSON.parse(JSON.stringify(selected)),target:selected,changed:false};draw();return}checkpoint();const it={type:tool,...settings(),x:p.x,y:p.y,x2:p.x,y2:p.y};if(tool==='pen')it.points=[p];drag={preview:it};draw()});
overlay.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=pt(e);if(drag.target){const dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>1&&!drag.changed){checkpoint();drag.changed=true}const it=drag.target,orig=drag.orig;if(it.type==='pen')it.points=orig.points.map(q=>({x:q.x+dx,y:q.y+dy}));else{it.x=orig.x+dx;it.y=orig.y+dy;if(it.type!=='text'){it.x2=orig.x2+dx;it.y2=orig.y2+dy}}}else if(drag.preview){const it=drag.preview;if(it.type==='pen')it.points.push(p);else{it.x2=p.x;it.y2=p.y}}draw()});
overlay.addEventListener('pointerup',()=>{if(!drag)return;if(drag.preview){current().push(drag.preview)}drag=null;draw();saveState()});overlay.addEventListener('pointercancel',()=>{drag=null;draw()});overlay.addEventListener('dblclick',e=>{if(tool==='select'){const it=findItem(pt(e));if(it&&it.type==='text')openEditor(null,it)}});
$('del').onclick=()=>{if(!selected)return;checkpoint();items[pageNo]=current().filter(i=>i!==selected);selected=null;$('del').disabled=true;draw();saveState()};$('undo').onclick=()=>{if(!history.length)return;items=JSON.parse(history.pop());selected=null;$('undo').disabled=!history.length;$('del').disabled=true;draw();saveState()};
for(const id of ['color','width','fontsize','rotation'])$(id).addEventListener('change',()=>{if(selected){checkpoint();Object.assign(selected,settings());draw();saveState()}});$('textmode').onchange=()=>$('prepared').classList.toggle('hide',$('textmode').value!=='prepare');for(const b of document.querySelectorAll('[data-tool]'))b.onclick=()=>setTool(b.dataset.tool);
$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await openPdf(new Uint8Array(await f.arrayBuffer()),f.name);setTool('move')}catch(err){alert(err.message)}e.target.value=''};
$('prev').onclick=async()=>{if(pageNo>1){pageNo--;selected=null;await fitPage()}};$('next').onclick=async()=>{if(pageNo<pdf.numPages){pageNo++;selected=null;await fitPage()}};async function zoom(f){if(!pdf)return;scale=clamp(scale*f,.4,5);await render()}async function fitPage(){if(!pdf)return;const p=await pdf.getPage(pageNo);const v=p.getViewport({scale:1});const usableWidth=Math.max(100,area.clientWidth-32);const usableHeight=Math.max(100,area.clientHeight-32);scale=clamp(Math.min(usableWidth/v.width,usableHeight/v.height),.05,5);area.scrollTop=0;area.scrollLeft=0;await render()}$('fit').onclick=fitPage;$('zin').onclick=()=>zoom(1.25);$('zout').onclick=()=>zoom(.8);
let pinch=null;area.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});area.addEventListener('touchend',e=>{if(pinch&&e.touches.length===0)pinch=null},{passive:true});area.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(Math.abs(d/pinch-1)>.18){const factor=d/pinch;pinch=d;zoom(factor)}}},{passive:true});
$('save').onclick=async()=>{if(!bytes)return;const b=$('save');b.disabled=true;msg('PDFを作成中…');try{await loadLibs();const doc=await pdfLib.PDFDocument.load(bytes,{ignoreEncryption:false});const pages=doc.getPages();for(let n=1;n<=pages.length;n++){const arr=items[n]||[];if(!arr.length)continue;const pg=pages[n-1],sz=pg.getSize(),c=document.createElement('canvas');const mult=2;c.width=Math.round(sz.width*mult);c.height=Math.round(sz.height*mult);const ctx=c.getContext('2d');ctx.scale(mult,mult);for(const it of arr)drawItem(ctx,it);const png=await doc.embedPng(c.toDataURL('image/png'));pg.drawImage(png,{x:0,y:0,width:sz.width,height:sz.height})}const out=await doc.save();const blob=new Blob([out],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=originalName+'_現場記入.pdf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);msg('PDF出力完了。iPhoneの「ファイル」に保存してください。')}catch(e){msg('出力エラー');alert('PDF出力に失敗しました：'+e.message)}finally{b.disabled=false}};
setTool('move');
</script></body></html>
